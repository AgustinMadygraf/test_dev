<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Expedientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 10px; border: none; }
        .table-hover tbody tr:hover { background-color: #f1f4f9; }
        .toast-container { z-index: 1060; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm" role="navigation" aria-label="Navegación principal">
        <div class="container">
            <a class="navbar-brand" href="#">📦 Sistema de Expedientes</a>
            <button class="btn btn-outline-light btn-sm" id="logoutBtn" aria-label="Cerrar sesión">Cerrar Sesión</button>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Formulario -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Registrar Expediente</h5>
                    </div>
                    <div class="card-body">
                        <form id="expedienteForm">
                            <div class="mb-3">
                                <label for="numero" class="form-label">Número</label>
                                <input type="text" class="form-control" id="numero" placeholder="Ej: 2023-ABC-123" required aria-required="true">
                            </div>
                            <div class="mb-3">
                                <label for="extracto" class="form-label">Extracto</label>
                                <input type="text" class="form-control" id="extracto" placeholder="Breve resumen" required aria-required="true">
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción Adicional</label>
                                <textarea class="form-control" id="descripcion" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100" id="submitBtn">
                                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                                <span class="btn-text">Crear Expediente</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Listado -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Expedientes en el Sistema</h5>
                        <button class="btn btn-sm btn-outline-primary" id="refreshBtn" aria-label="Actualizar listado">
                            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            <span class="btn-text">🔄 Actualizar</span>
                        </button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Número</th>
                                        <th>Extracto</th>
                                        <th>Owner</th>
                                        <th>Detalle</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="expedientesTableBody">
                                    <!-- Aquí se cargan los expedientes -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                    <div class="card-footer" id="paginationContainer"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Detalles -->
    <div class="modal fade" id="detallesModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Expediente #<span id="modalNumero"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <p><strong>Extracto:</strong> <span id="modalExtracto"></span></p>
                    <p><strong>Descripción:</strong> <span id="modalDescripcion"></span></p>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal de Edición -->
    <div class="modal fade" id="editModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Editar Expediente</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="editId">
                    <div class="mb-3">
                        <label class="form-label">Nuevo Extracto</label>
                        <input type="text" class="form-control" id="editExtracto">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="saveEditBtn">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast -->
    <div class="toast-container position-fixed bottom-0 end-0 p-3">
        <div id="liveToast" class="toast" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="toast-body" id="toastMessage"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/static/main.js"></script>
</body>
</html>

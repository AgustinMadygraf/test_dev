<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Expedientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; }
        .card { border-radius: 10px; border: none; }
        .table-hover tbody tr:hover { background-color: #f1f4f9; }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="#">📦 Sistema de Expedientes</a>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <!-- Formulario -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h5 class="mb-0">Registrar Expediente</h5>
                    </div>
                    <div class="card-body">
                        <form id="expedienteForm">
                            <div class="mb-3">
                                <label for="numero" class="form-label">Número</label>
                                <input type="text" class="form-control" id="numero" placeholder="Ej: 2023-ABC-123" required>
                            </div>
                            <div class="mb-3">
                                <label for="extracto" class="form-label">Extracto</label>
                                <input type="text" class="form-control" id="extracto" placeholder="Breve resumen" required>
                            </div>
                            <div class="mb-3">
                                <label for="owner_id" class="form-label">ID Propietario</label>
                                <input type="number" class="form-control" id="owner_id" value="1" required>
                            </div>
                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción Adicional</label>
                                <textarea class="form-control" id="descripcion" rows="3"></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Crear Expediente</button>
                        </form>
                    </div>
                </div>
            </div>

            <!-- Listado -->
            <div class="col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Expedientes en el Sistema</h5>
                        <button class="btn btn-sm btn-outline-primary" onclick="loadExpedientes()">🔄 Actualizar</button>
                    </div>
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Número</th>
                                        <th>Extracto</th>
                                        <th>Owner</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="expedientesTableBody">
                                    <!-- JS content -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/main.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro - Gestión de Expedientes</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css">
    <style>
        body { background-color: #f0f2f5; }
        .card { border: none; border-radius: 12px; }
        .btn-success { border-radius: 8px; padding: 10px; font-weight: 600; }
        .input-group-text { background: white; border-left: none; cursor: pointer; }
        .form-control:focus + .input-group-text { border-color: #198754; }
        .form-control { border-right: none; }
    </style>
</head>
<body class="d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-5 col-lg-4">
                <div class="card shadow-lg p-4">
                    <div class="text-center mb-4">
                        <h2 class="fw-bold">Crear Cuenta</h2>
                        <p class="text-muted">Únete a nuestro sistema</p>
                    </div>
                    <form id="registerForm">
                        <div class="mb-3">
                            <label for="full_name" class="form-label small fw-bold">Nombre Completo</label>
                            <input type="text" id="full_name" class="form-control" placeholder="Juan Pérez">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-bold">Email</label>
                            <input type="email" id="email" class="form-control" autocomplete="username" placeholder="nombre@ejemplo.com" required aria-required="true">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="form-label small fw-bold">Contraseña</label>
                            <div class="input-group">
                                <input type="password" id="password" class="form-control" autocomplete="new-password" placeholder="••••••••" required aria-required="true">
                                <button type="button" class="input-group-text" id="togglePassword" aria-label="Mostrar/ocultar contraseña">
                                    <i class="bi bi-eye"></i>
                                </button>
                            </div>
                        </div>
                        <button type="submit" class="btn btn-success w-100 mb-3" id="registerBtn">
                            <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                            <span class="btn-text">Registrarse</span>
                        </button>
                    </form>
                    <div class="text-center">
                        <p class="mb-0 small text-muted">¿Ya tienes cuenta? <a href="/login" class="text-decoration-none fw-bold">Inicia sesión</a></p>
                    </div>
                </div>
                <div id="alertContainer" class="mt-3" role="alert" aria-live="polite"></div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('togglePassword').addEventListener('click', function() {
            const password = document.getElementById('password');
            const icon = this.querySelector('i');
            if (password.type === 'password') {
                password.type = 'text';
                icon.classList.replace('bi-eye', 'bi-eye-slash');
            } else {
                password.type = 'password';
                icon.classList.replace('bi-eye-slash', 'bi-eye');
            }
        });

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('registerBtn');
            const spinner = btn.querySelector('.spinner-border');
            const text = btn.querySelector('.btn-text');
            const alertContainer = document.getElementById('alertContainer');

            alertContainer.innerHTML = '';
            btn.disabled = true;
            if (spinner) spinner.classList.remove('d-none');
            if (text) text.classList.add('opacity-50');

            const payload = {
                full_name: document.getElementById('full_name').value || null,
                email: document.getElementById('email').value,
                password: document.getElementById('password').value
            };

            try {
                const response = await fetch('/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });

                if (response.ok) {
                    alertContainer.innerHTML = '<div class="alert alert-success small py-2">Usuario creado con éxito. Redirigiendo...</div>';
                    setTimeout(() => { window.location.href = '/login'; }, 2000);
                } else {
                    const err = await response.json();
                    alertContainer.innerHTML = '<div class="alert alert-danger small py-2">Error: ' + (err.detail || 'No se pudo crear el usuario') + '</div>';
                }
            } catch (error) {
                alertContainer.innerHTML = '<div class="alert alert-danger small py-2">Error de conexión</div>';
            } finally {
                if (alertContainer.innerHTML.includes('alert-danger')) {
                    btn.disabled = false;
                    if (spinner) spinner.classList.add('d-none');
                    if (text) text.classList.remove('opacity-50');
                }
            }
        });
    </script>
</body>
</html>
